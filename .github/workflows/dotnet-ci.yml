name: .NET Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: |
          pwd
          dir

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore Week10_CET2007.sln

      - name: Build
        run: msbuild Week10_CET2007.sln /p:Configuration=Release

      - name: Test
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere -latest -products '*' -property installationPath

          if (!$vsPath) {
              throw "Visual Studio installation not found."
          }

          $vstest = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"

          if (!(Test-Path $vstest)) {
              throw "VSTest executable not found: $vstest"
          }

          $testDll = "OrderServiceTests\bin\Release\OrderServiceTests.dll"

          if (!(Test-Path $testDll)) {
              throw "Test DLL not found: $testDll"
          }

          Write-Host "Running tests using: $vstest"

          & $vstest $testDll

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
