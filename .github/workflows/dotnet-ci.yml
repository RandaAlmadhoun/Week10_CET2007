name: .NET Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: |
          pwd
          dir

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore Week10_CET2007.sln

      - name: Build
        run: msbuild Week10_CET2007.sln /p:Configuration=Release

      - name: Test
        run: |
          $vstest = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio" -Filter vstest.console.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if (!$vstest) { throw "VSTest not found" }

          & $vstest.FullName "OrderServiceTests\bin\Release\OrderServiceTests.dll"
